services:
  opentrace:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      OPENTRACE_STORAGE: ${OPENTRACE_STORAGE:-memory}
      OPENTRACE_SQLITE_PATH: ${OPENTRACE_SQLITE_PATH:-./data/opentrace.sqlite3}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
