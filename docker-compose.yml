services:
  opentrace:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      OPENTRACE_STORAGE_MODE: ${OPENTRACE_STORAGE_MODE:-${OPENTRACE_STORAGE:-memory}}
      OPENTRACE_SQLITE_PATH: ${OPENTRACE_SQLITE_PATH:-/app/data/opentrace.db}
      OPENTRACE_DEFAULT_TIMEOUT: ${OPENTRACE_DEFAULT_TIMEOUT:-${OPENTRACE_REQUEST_TIMEOUT_SECONDS:-10.0}}
      OPENTRACE_MAX_RUNTIME: ${OPENTRACE_MAX_RUNTIME:-${OPENTRACE_MAX_RUNTIME_SECONDS:-60.0}}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
