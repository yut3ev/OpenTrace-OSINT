services:
  # OpenTrace FastAPI Backend Service (Deployed using Dockerfile on Render)
  - type: web
    name: opentrace-api
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENTRACE_STORAGE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: opentrace-db
          property: connectionString
      - key: OPENTRACE_REQUIRE_AUTH
        value: "true"
      - key: OPENTRACE_JWT_SECRET
        generateValue: true
      - key: OPENTRACE_JWT_ALGORITHM
        value: HS256
      - key: OPENTRACE_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: OPENTRACE_ALLOW_REGISTRATION
        value: "true"
      - key: OPENTRACE_MAX_CONCURRENCY
        value: "4"
      - key: OPENTRACE_PER_HOST_CONCURRENCY
        value: "2"
      - key: OPENTRACE_DEFAULT_TIMEOUT
        value: "10.0"
      - key: OPENTRACE_MAX_RUNTIME
        value: "60.0"
      - key: OPENTRACE_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: OPENTRACE_AUTH_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: OPENTRACE_CORS_ORIGINS
        value: "https://opentrace.vercel.app,http://localhost:5173,http://localhost:3000"

databases:
  # Free Managed PostgreSQL Database on Render for persistent production storage
  - name: opentrace-db
    plan: free
    region: oregon
    databaseName: opentrace
    user: opentrace
