  # ============================================================================
  # EMAIL INVESTIGATION MODULES
  # ============================================================================
  - id: "email.syntax"
    name: "Email Syntax Validation"
    category: "email"
    target_type: "email"
    access_type: "local_analysis"
    source_url: "https://datatracker.ietf.org/doc/html/rfc5321"
    status: "implemented"
    capabilities: ["tested"]
    description: "RFC 5321 / RFC 5322 structural syntax analysis, IDNA normalization."
    limitations: ["Does not confirm mailbox existence"]

  - id: "email.dns"
    name: "Email DNS MX Lookup"
    category: "email"
    target_type: "email"
    access_type: "public_api"
    source_url: "dns://{domain}/MX"
    status: "implemented"
    capabilities: ["tested"]
    description: "Queries public Mail Exchanger (MX) DNS records with preference priorities."
    limitations: ["DNS records indicate mail routing, not recipient mailbox presence"]

  - id: "email.disposable"
    name: "Disposable Email Check"
    category: "email"
    target_type: "email"
    access_type: "local_analysis"
    source_url: "https://github.com/disposable-email-domains/disposable-email-domains"
    status: "implemented"
    capabilities: ["tested"]
    description: "Detects known temporary and disposable email inbox services."
    limitations: ["Maintains list of 500+ common throwaway domains"]

  - id: "email.gravatar"
    name: "Gravatar Profile Discovery"
    category: "email"
    target_type: "email"
    access_type: "public_api"
    source_url: "https://en.gravatar.com/{hash}.json"
    status: "implemented"
    capabilities: ["public_web", "tested"]
    description: "Computes MD5 hash of email and checks public Gravatar profile entries."
    limitations: ["Only returns profiles explicitly set to public by the account holder"]

  - id: "email.security"
    name: "Domain SPF & DMARC Security"
    category: "email"
    target_type: "email"
    access_type: "public_api"
    source_url: "dns://{domain}/TXT"
    status: "implemented"
    capabilities: ["tested"]
    description: "Inspects sender policy framework (SPF) and DMARC DNS policies for domain."
    limitations: ["Domain-level security policy, does not verify individual mailbox"]

  - id: "email.hibp"
    name: "HaveIBeenPwned API (Authorized)"
    category: "email"
    target_type: "email"
    access_type: "requires_api_key"
    source_url: "https://haveibeenpwned.com/API/v3"
    status: "requires_api_key"
    capabilities: ["requires_api_key"]
    description: "Authorized lookup for public breach appearances via official HIBP API."
    limitations: ["Requires HIBP_API_KEY environment variable. Reports requires_api_key when unset"]

  # ============================================================================
