[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentrace-osint"
version = "0.1.0"
description = "Evidence-first public digital-footprint OSINT platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "phonenumbers>=8.13,<10",
  "dnspython>=2.6,<3",
  "pyyaml>=6.0,<7",
  "bcrypt>=4.0",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "types-PyYAML>=6.0",
]

[project.scripts]
opentrace = "opentrace.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opentrace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opentrace"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
